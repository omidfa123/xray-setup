# VPN stack. One container per part, all on host networking:
#   xray     VLESS+REALITY tcp/443. Exits: direct, WARP (built-in WireGuard), psiphon, lantern
#   hysteria Hysteria2 udp/8444
#   psiphon  local SOCKS 127.0.0.1:1080
#   lantern  local SOCKS 127.0.0.1:12346 (off unless COMPOSE_PROFILES=lantern in .env)
#   monitor  usage/IP/session/error collector -> data/vpn.db  (./report.sh to read it)
#   sub      subscription URL on tcp/SUB_PORT (path = SUB_TOKEN)
# Configs are generated by ./render.sh from .env -- run it after editing .env.

x-common: &common
  network_mode: host
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  read_only: true
  ulimits:
    nofile: { soft: 1048576, hard: 1048576 }
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  xray:
    <<: *common
    build: ./xray
    image: local/xray:v26.10.21
    container_name: xray
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
      - ./logs/xray:/var/log/xray

  hysteria:
    <<: *common
    build: ./hysteria
    image: local/hysteria:v2.13.0
    container_name: hysteria
    init: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # JSON logs to a file as well, for the monitor
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/hysteria server --disable-update-check -f json -c /etc/hysteria/config.yaml 2>&1 | tee -a /var/log/hysteria/hysteria.log"]
    volumes:
      - ./hysteria/config.yaml:/etc/hysteria/config.yaml:ro
      - ./hysteria/server.crt:/etc/hysteria/server.crt:ro
      - ./hysteria/server.key:/etc/hysteria/server.key:ro
      - ./logs/hysteria:/var/log/hysteria

  psiphon:
    <<: *common
    build: ./psiphon
    image: local/psiphon:host
    container_name: psiphon
    init: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - ./psiphon/client.config:/etc/psiphon/client.config:ro
      - ./psiphon/data:/var/lib/psiphon
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 3

  lantern:
    <<: *common
    profiles: [lantern]
    build: ./lantern
    image: local/lantern:1.2.8
    container_name: lantern
    init: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - ./lantern/data:/data

  monitor:
    <<: *common
    build: ./monitor
    image: local/vpn-monitor:1
    container_name: monitor
    cap_drop: [ALL]
    environment:
      HY2_PASSWORD: ${HY2_PASSWORD}
      KEEP_DAYS: "90"
    volumes:
      - ./logs:/logs:ro
      - ./data:/data

  sub:
    <<: *common
    image: local/vpn-monitor:1
    container_name: sub
    cap_drop: [ALL]
    entrypoint: ["python3", "-u", "/app/subserver.py"]
    environment:
      SUB_TOKEN: ${SUB_TOKEN}
      SUB_PORT: ${SUB_PORT}
    volumes:
      - ./clients/sub:/sub:ro
      - ./data:/data:ro
